<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer Background Circle -->
  <circle cx="100" cy="100" r="96" fill="#070A0F" stroke="#29ABE2" stroke-width="4"/>
  
  <!-- Dashed Outer Gear Ring -->
  <circle cx="100" cy="100" r="84" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="14 10" opacity="0.9"/>
  <circle cx="100" cy="100" r="74" stroke="#29ABE2" stroke-width="2" opacity="0.6"/>

  <!-- 3 Curved Aero Propeller Blades -->
  <!-- Top Blade -->
  <g>
    <path d="M100 28 C118 52 122 78 100 118 C78 78 82 52 100 28 Z" fill="url(#bladeGrad1)" stroke="#00D2FF" stroke-width="2.5"/>
    <circle cx="100" cy="50" r="3" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Bottom-Right Blade (Rotated 120 deg) -->
  <g transform="rotate(120 100 100)">
    <path d="M100 28 C118 52 122 78 100 118 C78 78 82 52 100 28 Z" fill="url(#bladeGrad2)" stroke="#29ABE2" stroke-width="2.5"/>
    <circle cx="100" cy="50" r="3" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Bottom-Left Blade (Rotated 240 deg) -->
  <g transform="rotate(240 100 100)">
    <path d="M100 28 C118 52 122 78 100 118 C78 78 82 52 100 28 Z" fill="url(#bladeGrad3)" stroke="#1E6FBA" stroke-width="2.5"/>
    <circle cx="100" cy="50" r="3" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Center Metallic Hub Ring -->
  <circle cx="100" cy="100" r="22" fill="#0D131F" stroke="#29ABE2" stroke-width="4"/>
  <circle cx="100" cy="100" r="12" fill="url(#hubGrad)" stroke="#00D2FF" stroke-width="2"/>
  <circle cx="100" cy="100" r="5" fill="#FFFFFF"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bladeGrad1" x1="100" y1="28" x2="100" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D2FF"/>
      <stop offset="0.6" stop-color="#29ABE2"/>
      <stop offset="1" stop-color="#1E6FBA"/>
    </linearGradient>
    <linearGradient id="bladeGrad2" x1="100" y1="28" x2="100" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29ABE2"/>
      <stop offset="0.6" stop-color="#1E6FBA"/>
      <stop offset="1" stop-color="#0D131F"/>
    </linearGradient>
    <linearGradient id="bladeGrad3" x1="100" y1="28" x2="100" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E6FBA"/>
      <stop offset="0.6" stop-color="#00D2FF"/>
      <stop offset="1" stop-color="#29ABE2"/>
    </linearGradient>
    <radialGradient id="hubGrad" cx="100" cy="100" r="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D2FF"/>
      <stop offset="1" stop-color="#0D131F"/>
    </radialGradient>
  </defs>
</svg>
